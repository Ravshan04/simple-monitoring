template: local_cpu_usage_80
      on: system.cpu
   class: Utilization
    type: System
component: CPU
  lookup: average -1m unaligned of user,system,softirq,irq,guest
   units: %
   every: 10s
    warn: $this > 80
    crit: $this > 90
   delay: up 10s down 1m multiplier 1.5 max 10m
 summary: CPU usage is above 80%
    info: Average CPU utilization has crossed the local lab threshold.
      to: silent
